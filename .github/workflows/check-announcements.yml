# Vérifie les annonces (titre, départements, date d'expiration) à chaque dépôt dans
# announcements/. En cas d'erreur, l'action échoue (croix rouge) et indique le fichier à corriger.
name: Vérification des annonces

on:
  push:
    branches: [main]
    paths:
      - "announcements/**"
      - "tools/check_announcements.py"
      - ".github/workflows/check-announcements.yml"
  pull_request:
    paths:
      - "announcements/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les annonces
        run: python tools/check_announcements.py .
