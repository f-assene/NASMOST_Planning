# Convertit les emplois du temps (.docx / .pdf) déposés dans les dossiers des départements
# en fichiers .ics lus par l'application NASMOST Planning, puis les enregistre dans le dépôt.
name: Emplois du temps -> .ics

on:
  push:
    branches: [main]
    paths:
      - "**.docx"
      - "**.pdf"
      - "tools/**"
      - ".github/workflows/timetables-to-ics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetables-to-ics
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Installer les dépendances
        run: pip install -r tools/requirements.txt

      - name: Générer les fichiers .ics
        run: python tools/timetable_to_ics.py .

      - name: Enregistrer les fichiers .ics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.ics'
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour automatique des fichiers .ics"
            git push
          fi
