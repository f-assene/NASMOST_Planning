# Publication : à chaque dépôt, convertit les emplois du temps (.docx / .pdf) en .ics, puis met à
# jour index.json (liste des fichiers lue par l'application).
# Une erreur sur un fichier n'arrête jamais la publication : les fichiers corrects sont publiés,
# les problèmes sont notés dans RAPPORT_CONVERSION.md et dans le résumé de cette action.
name: Publication (emplois du temps -> .ics, index)

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Installer les dépendances
        run: pip install -r tools/requirements.txt

      - name: Préparer git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Générer les fichiers .ics
        run: |
          # Même en cas d'incident imprévu, la suite (index, publication) est exécutée.
          python tools/timetable_to_ics.py . || echo "::error::La conversion s'est arrêtée de façon inattendue : voir le journal."
          git add -A -- '*.ics' timetables.json RAPPORT_CONVERSION.md
          git diff --cached --quiet || git commit -m "Mise à jour automatique des fichiers .ics"

      - name: Mettre à jour index.json
        run: |
          python tools/build_index.py . || echo "::error::index.json n'a pas pu être mis à jour : voir le journal."
          git add index.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique de index.json"

      - name: Publier
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Résumé
        if: always()
        run: |
          if [ -f RAPPORT_CONVERSION.md ]; then cat RAPPORT_CONVERSION.md >> "$GITHUB_STEP_SUMMARY"; fi
