# Publication : à chaque dépôt, convertit les emplois du temps (.docx / .pdf) des dossiers de
# départements en .ics, puis met à jour index.json (liste des fichiers lue par l'application).
name: Publication (emplois du temps -> .ics, index)

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Installer les dépendances
        run: pip install -r tools/requirements.txt

      - name: Préparer git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Générer les fichiers .ics
        run: |
          python tools/timetable_to_ics.py .
          git add -A -- '*.ics'
          git diff --cached --quiet || git commit -m "Mise à jour automatique des fichiers .ics"

      - name: Mettre à jour index.json
        run: |
          python tools/build_index.py .
          git add index.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique de index.json"

      - name: Publier
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main
